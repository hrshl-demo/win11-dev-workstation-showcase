name: Workstation showcase checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.7'
      - run: uv sync --locked
        working-directory: samples/python-emi-api
      - run: uv run --locked pytest
        working-directory: samples/python-emi-api
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
          cache-dependency-path: samples/java-ifsc-service/pom.xml
      - run: ./mvnw -B verify
        working-directory: samples/java-ifsc-service
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: samples/go-fx-rates/go.mod
          cache: false
      - run: go vet ./... && go test ./...
        working-directory: samples/go-fx-rates
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Analyze and run safe script tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -Repository PSGallery
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
          $issues = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning)
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) { throw "PSScriptAnalyzer reported $($issues.Count) findings" }
          $result = Invoke-Pester -Path tests -PassThru
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Safe script tests failed or did not run' }
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/validate_repository.py
