[project]
name = "python-emi-api"
version = "1.0.0"
description = "Synthetic INR EMI calculations with exact decimal arithmetic"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.118.0",
    "pydantic==2.12.4",
    "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
    "coverage==7.10.6",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==7.0.0",
    "ruff==0.14.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
